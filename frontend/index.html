<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rng=seed=>{let a=seed>>>0;return()=>{a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const hx=x=>"0x"+(x>>>0).toString(16).padStart(8,"0"),COL={healthy:"gn",suspected:"am",faulted:"rd",unknown:"un"};
const MAXN=16,NAMES="ABCDEFGHIJKLMNOP";
let NET={n:4,preset:"full",tpi:10,lat:4,bw:64},EP=[],LK=[];
function layout(ids,pr){const n=ids.length,cx=400,cy=280,r=Math.min(210,Math.max(120,n*22)),an=i=>2*Math.PI*i/n-Math.PI/2;
if(pr=="mesh"){const c=Math.ceil(Math.sqrt(n)),rw=Math.ceil(n/c),gx=Math.min(190,600/Math.max(1,c-1)),gy=Math.min(150,400/Math.max(1,rw-1));return ids.map((id,i)=>({id,x:cx+((i%c)-(c-1)/2)*gx,y:cy+(Math.floor(i/c)-(rw-1)/2)*gy}))}
if(pr=="star")return ids.map((id,i)=>{const a=2*Math.PI*(i-1)/Math.max(1,n-1)-Math.PI/2;return i?{id,x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}:{id,x:cx,y:cy}});
return ids.map((id,i)=>({id,x:cx+r*Math.cos(an(i)),y:cy+r*Math.sin(an(i))}))}
function pairs(n,pr){const o=[];if(pr=="ring")for(let i=0;i<n;i++)o.push([i,(i+1)%n]);if(pr=="star")for(let i=1;i<n;i++)o.push([0,i]);
if(pr=="full")for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)o.push([i,j]);
if(pr=="mesh"){const c=Math.ceil(Math.sqrt(n));for(let i=0;i<n;i++){if(i%c<c-1&&i+1<n)o.push([i,i+1]);if(i+c<n)o.push([i,i+c])}}return o}
function build(n,pr){NET.n=n;NET.preset=pr;const ids=[...NAMES].slice(0,n);EP=layout(ids,pr).map(e=>({...e,nm:"Chiplet "+e.id}));LK=pairs(n,pr).map(([a,b],i)=>({id:"L"+(i+1),s:ids[a],d:ids[b],lat:NET.lat,bw:NET.bw}))}
build(4,"full");
function netChanged(m){S.exps=[];S.cmp.clear();S.sel=S.selN=S.ev=null;S.rep=null;runSim(SC[0]);toast(m);render()}
function applyNet(){const n=parseInt($("#cn").value),pr=$("#cp").value;if(!(n>=2&&n<=MAXN))return toast("Chiplet count must be a whole number from 2 to "+MAXN+".");
if(pr=="full"&&n>8)return toast("Fully connected is limited to 8 chiplets (28 links).");NET.tpi=+$("#ct").value;NET.lat=Math.max(1,Math.min(32,parseInt($("#cl").value)||4));NET.bw=+$("#cw").value;build(n,pr);
netChanged("Network rebuilt: "+n+" chiplets, "+LK.length+" links ("+pr+"). Run history was cleared because link IDs changed.")}
function addLink(){const a=$("#as").value,b=$("#ad").value;if(a==b)return toast("Choose two different chiplets.");if(LK.some(l=>l.s==a&&l.d==b))return toast("That directed link already exists.");if(LK.length>=120)return toast("Link limit is 120.");
const id="L"+(Math.max(0,...LK.map(l=>+l.id.slice(1)))+1);LK.push({id,s:a,d:b,lat:NET.lat,bw:NET.bw});NET.preset="custom";netChanged("Link "+id+" added ("+a+" to "+b+"). Run history was cleared because the topology changed.")}
function rmLink(){const id=S.sel;if(!id)return;if(LK.length<=1)return toast("At least one link is required.");LK=LK.filter(l=>l.id!=id);NET.preset="custom";netChanged("Link "+id+" removed. Run history was cleared because the topology changed.")}
function rename(){const q=EP.find(x=>x.id==S.selN),v=$("#rn").value.trim();if(!q||!v||v.length>24)return toast("Name must be 1â€“24 characters.");q.nm=v;render()}
const SC=[
{id:"healthy",name:"Healthy Baseline",seed:101,desc:"No fault injected.",faults:[]},
{id:"bit",name:"Bit Corruption",seed:202,desc:"Bits 3 and 17 flipped on L3 (intervals 4â€“17).",faults:[{link:"L3",type:"bit",bits:[3,17],start:4,dur:14}]},
{id:"delay",name:"Transfer Delay",seed:303,desc:"+14 cycles on L1 (intervals 2â€“17).",faults:[{link:"L1",type:"delay",delay:14,start:2,dur:16}]},
{id:"drop",name:"Dropped Transfer",seed:404,desc:"Every 7th transfer on L5 dropped.",faults:[{link:"L5",type:"drop",every:7,start:0,dur:20}]},
{id:"inter",name:"Intermittent Link Fault",seed:505,desc:"Corruption bursts on L2 (intervals 3â€“5 and 11â€“13).",faults:[{link:"L2",type:"bit",bits:[0],start:3,dur:3},{link:"L2",type:"bit",bits:[0],start:11,dur:3}]},
{id:"multi",name:"Multiple Faults",seed:606,desc:"Delay on L1 plus drops on L4.",faults:[{link:"L1",type:"delay",delay:9,start:5,dur:12},{link:"L4",type:"drop",every:5,start:3,dur:14}]}];
let S={mode:"demo",page:"overview",exps:[],cur:null,sel:null,selN:null,ev:null,cmp:new Set(),rep:null,running:null,vb:{x:0,y:0,w:800,h:560},q:"",sf:"",v3:true,vt:"3d",it:"chiplet",dc:null,pl:true,pr:true,src:null,sj:"",se:[],pend:null,f:{q:"",sev:"",typ:"",lnk:""},live:{target:"fastapi",url:"http://127.0.0.1:8000/api/v1",state:"idle",msg:"",last:null},hardwareStatus:null,hardwareBusy:false,backendTopology:null,backendExperiments:[],backendSelected:null,backendEvents:[],backendBusy:false,fe:[]};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ---- deterministic simulation (abstract model; no RTL, no hardware) ---- */
function sim(sc){const R=rng(sc.seed),ev=[],L={};let n_=0;
LK.forEach(l=>{const m={tr:0,er:0,dr:0,ex:0,sum:0,rc:0,mx:0,lat:[],an:[],rcv:[]};
for(let i=0;i<20;i++){let ls=0,a=0,rc=0;
for(let k=0;k<NET.tpi;k++){const n=i*NET.tpi+k,exp=Math.floor(R()*4294967296);let lat=l.lat+Math.floor(R()*3),t=null,sv="",ob=null,dp=0;
const f=sc.faults.find(f=>f.link==l.id&&i>=f.start&&i<f.start+f.dur);
if(f){if(f.type=="bit"&&R()<.6){ob=(exp^f.bits.reduce((x,b)=>x|(1<<b),0))>>>0;t="data_mismatch";sv="error";m.er++}
else if(f.type=="delay"){lat+=f.delay;if(lat>l.lat+4){t=lat>32?"protocol_violation":"latency_excursion";sv=lat>32?"critical":"warning";m.ex++}}
else if(f.type=="drop"&&(n+1)%f.every==0){dp=1;t="dropped_transfer";sv="error";m.dr++}}
m.tr++;if(!dp){m.sum+=lat;m.rc++;rc++;ls+=lat;m.mx=Math.max(m.mx,lat)}
if(t){a++;ev.push({cyc:n*8,link:l.id,type:t,sev:sv,exp:hx(exp),obs:ob==null?"â€”":hx(ob),lat:dp?null:lat})}}
m.lat.push(+(ls/Math.max(1,rc)).toFixed(2));m.an.push(a);m.rcv.push(rc)}
m.avg=m.rc?+(m.sum/m.rc).toFixed(2):null;const an=m.er+m.dr+m.ex;m.an_=an;m.st=an==0?"healthy":an/m.tr>.1?"faulted":"suspected";L[l.id]=m});
ev.sort((a,b)=>a.cyc-b.cyc||(a.link<b.link?-1:1));return{L,ev}}
function runSim(sc){sc={...sc,faults:sc.faults.map(f=>({...f,link:LK[(parseInt(f.link.slice(1))-1)%LK.length].id}))};const r=sim(sc),id="DEMO-"+String(S.exps.length+1).padStart(3,"0");r.ev.forEach((e,i)=>{e.id=id+"-EV"+String(i+1).padStart(3,"0");e.xid=id});
const V=Object.values(r.L),T=k=>V.reduce((a,m)=>a+m[k],0);
const e={id,name:sc.name,sc,seed:sc.seed,source:"DEMO SIMULATION",net:{n:NET.n,preset:NET.preset,links:LK.length,tpi:NET.tpi,lat:NET.lat},at:new Date().toISOString(),L:r.L,ev:r.ev,plan:[],
tot:{tr:T("tr"),er:T("er"),dr:T("dr"),ex:T("ex"),avg:+(T("sum")/T("rc")).toFixed(2),mx:Math.max(...V.map(m=>m.mx)),bad:V.filter(m=>m.st!="healthy").length}};
S.exps.push(e);S.cur=id;return e}
const cur=()=>S.exps.find(e=>e.id==S.cur);
function run(sc){if(S.running)return;S.running=sc.name;render();setTimeout(()=>{const e=runSim(sc);S.running=null;S.sel=null;S.ev=null;toast("Simulated run "+e.id+" complete: "+sc.name);render()},reduce?0:700)}
function toast(m){$("#toast").textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toast").textContent="",4500)}
/* ---- adaptive planner: documented heuristic, NOT a calibrated probability ---- */
const TESTS=()=>[{id:"T-SWEEP",name:"Full-fabric sweep",L:LK.map(l=>l.id)},...EP.map(p=>({id:"T-EP-"+p.id,name:"Endpoint fan-out: Chiplet "+p.id,L:LK.filter(l=>l.s==p.id||l.d==p.id).map(l=>l.id)})),...LK.map(l=>({id:"T-"+l.id,name:"Link probe: "+l.id,L:[l.id]}))];
function susp(e){const a=LK.map(l=>e.L[l.id].an_),tot=a.reduce((x,y)=>x+y,0);if(!tot)return null;
let w=a.map(x=>x+.5);e.plan.forEach(p=>{const t=TESTS().find(t=>t.id==p.id);w=w.map((v,i)=>v*(t.L.includes(LK[i].id)?(p.fail?4:.1):(p.fail?1:1)));});const s=w.reduce((x,y)=>x+y,0);return w.map(v=>v/s)}
function cand(e,s){return TESTS().filter(t=>!e.plan.some(p=>p.id==t.id)).map(t=>{const m=t.L.reduce((a,id)=>a+s[LK.findIndex(l=>l.id==id)],0);return{...t,m,sc:m*(1-m)/(1+.1*t.L.length)}}).sort((a,b)=>b.sc-a.sc||(a.id<b.id?-1:1))}
/* ---- charts ---- */
function chart(labels,series,y,x,bar){const W=560,H=190,m={l:44,r:8,t:8,b:36},n=labels.length,mx=Math.max(1,...series.flatMap(s=>s.v)),iw=W-m.l-m.r,ih=H-m.t-m.b,Y=v=>m.t+ih-v/mx*ih;
let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(y)} by ${esc(x)}"><g class="ax">`;
for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)"/><text x="${m.l-4}" y="${Y(v)+3}" text-anchor="end">${+v.toFixed(1)}</text>`}
const step=Math.ceil(n/10);labels.forEach((l,i)=>{if(i%step==0){const cx=bar?m.l+(i+.5)*iw/n:m.l+i*iw/Math.max(1,n-1);s+=`<text x="${cx}" y="${H-20}" text-anchor="middle">${esc(l)}</text>`}});

async function backendApi(path,options={}){
const base=S.live.url.replace(/\/+$/,"");
const response=await fetch(base+path,{
...options,
credentials:"omit",
headers:{"Content-Type":"application/json",...(options.headers||{})}
});
let data;
try{data=await response.json()}catch(_){data=null}
if(!response.ok){
const detail=data&&data.detail;
throw new Error(typeof detail==="string"?detail:"HTTP "+response.status);
}
return data;
}
const FPGA_BENCH_KEY="interconnectsentry.fpgaBenchHistory.v1";
const FPGA_BENCH_COMPARE_KEY="interconnectsentry.fpgaBenchCompare.v1";

function readFpgaBenchHistory(){
try{
const value=JSON.parse(localStorage.getItem(FPGA_BENCH_KEY)||"[]");
return Array.isArray(value)?value:[];
}catch(_){return[]}
}
function readFpgaBenchCompare(){
try{
const value=JSON.parse(localStorage.getItem(FPGA_BENCH_COMPARE_KEY)||"[]");
return Array.isArray(value)?value:["",""];

async function runFpgaBenchExperiment(){
if(S.live.state!=="connected"||S.live.target!=="fpga"){
return toast("Connect to the PYNQ-Z2 target first.");
}
if(S.hardwareBusy)return;

const value=id=>document.getElementById(id)?.value;
const name=(value("fbName")||"").trim();
const workload=Number(value("fbWorkload"));
const target=Number(value("fbTarget"));
const faultType=Number(value("fbFaultType"));
const faultEnable=!!document.getElementById("fbFaultEnable")?.checked;
const mask=Number.parseInt((value("fbMask")||"").trim(),0);
const delay=Number(value("fbDelay"));
const drop=Number(value("fbDrop"));

if(!name||!Number.isInteger(workload)||workload<1||workload>65535||
!Number.isInteger(target)||target<0||target>15||
!Number.isInteger(faultType)||faultType<0||faultType>3||
!Number.isInteger(mask)||mask<0||mask>0xFFFFFFFF||
!Number.isInteger(delay)||delay<0||delay>255||
!Number.isInteger(drop)||drop<0||drop>255){
return toast("Check the experiment name and hardware configuration values.");
}

const config={
workload,
target_link:target,
fault_type:faultType,
fault_enable:faultEnable,
fault_mask:mask,
delay_cycles:delay,
drop_interval:drop
};

S.hardwareBusy=true;
render();

try{
const before=await backendApi("/hardware/status");
const baseline=Number(before.transfers)||0;

await backendApi("/hardware/start",{
method:"POST",
body:JSON.stringify(config)
});

const deadline=Date.now()+120000;
let finalStatus=null;
let sawRunning=false;

while(Date.now()<deadline){
await new Promise(resolve=>setTimeout(resolve,350));
const current=await backendApi("/hardware/status");
S.hardwareStatus=current;
const state=String(current.status||"").toUpperCase();

if(state==="RUNNING")sawRunning=true;
if(state==="ERROR")throw new Error("FPGA reported ERROR: "+(current.raw||"unknown status"));

const currentTransfers=Number(current.transfers)||0;
if(state==="DONE"&&(sawRunning||currentTransfers>baseline)){
finalStatus=current;
break;
}
}

if(!finalStatus){
throw new Error("Timed out waiting for FPGA completion. Refresh hardware status and check the board.");
}

const record={
id:Date.now(),
name,
timestamp:finalStatus.timestamp||new Date().toISOString(),
config,
baseline_transfers:baseline,
transfers_this_run:Math.max(0,(Number(finalStatus.transfers)||0)-baseline),
status:{
device:finalStatus.device||"PYNQ-Z2",
status:finalStatus.status,
raw:finalStatus.raw,
transfers:finalStatus.transfers,
fault_detected:finalStatus.fault_detected===true,
localized:finalStatus.localized===true,
evidence_valid:finalStatus.evidence_valid===true,
timestamp:finalStatus.timestamp||new Date().toISOString()
}
};

const history=readFpgaBenchHistory();
history.unshift(record);
localStorage.setItem(FPGA_BENCH_KEY,JSON.stringify(history));
toast("FPGA experiment completed and saved: "+name);
}catch(x){
toast("FPGA experiment failed: "+(x&&x.message||"unknown error"));
}finally{
S.hardwareBusy=false;
render();
}
}

function applyBackendPreset(preset){
const current=S.backendTopology;
if(!current||!Array.isArray(current.endpoints))return toast("Load backend topology first.");

const endpoints=current.endpoints.map(p=>({...p}));
const n=endpoints.length;
if(n<2)return toast("At least two endpoints are required.");

if(preset==="full"&&n>8)return toast("Fully connected is limited to 8 endpoints.");

const pairs=[];
if(preset==="ring"){
for(let i=0;i<n;i++)pairs.push([i,(i+1)%n]);
}else if(preset==="star"){
for(let i=1;i<n;i++)pairs.push([0,i]);
}else if(preset==="full"){
for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)pairs.push([i,j]);
}else if(preset==="mesh"){
const cols=Math.ceil(Math.sqrt(n));
for(let i=0;i<n;i++){
if(i%cols<cols-1&&i+1<n)pairs.push([i,i+1]);
if(i+cols<n)pairs.push([i,i+cols]);
}
}else return toast("Unknown topology preset.");

const oldLinks=current.links||[];
const width=oldLinks[0]?.widthBits??32;
const clock=oldLinks[0]?.clockMHz??500;

const links=pairs.map(([a,b],i)=>({
id:"L"+(i+1),
source:endpoints[a].id,
destination:endpoints[b].id,
widthBits:width,
clockMHz:clock
}));

const topology={
schemaVersion:1,
source:"backend",
endpoints,
links
};

const editor=$("#backendTopologyEditor");
if(editor)editor.value=JSON.stringify(topology,null,2);

S.backendTopology=topology;
toast(preset.toUpperCase()+" topology generated. Saving to backend...");
return saveBackendTopology();
}
async function saveBackendTopology(){
const L=S.live;
if(L.state!=="connected"||!S.backendTopology){
toast("Connect to the backend before saving.");
return;
}
const editor=$("#backendTopologyEditor");
if(!editor){
toast("Topology editor not found.");
return;
}
let topology;
try{
topology=JSON.parse(editor.value);
}catch(x){
toast("Invalid JSON: "+x.message);
return;
}
if(!topology||topology.schemaVersion!==1||
   !Array.isArray(topology.endpoints)||!Array.isArray(topology.links)||
   topology.endpoints.length<2||topology.links.length<1){
toast("Invalid topology: schemaVersion 1, at least two endpoints and one link are required.");
return;
}
const endpointIds=topology.endpoints.map(p=>p&&p.id);
const linkIds=topology.links.map(l=>l&&l.id);
if(endpointIds.some(id=>typeof id!=="string"||!id.trim())||
   new Set(endpointIds).size!==endpointIds.length){
toast("Endpoint IDs must be non-empty and unique.");
return;
}
if(linkIds.some(id=>typeof id!=="string"||!id.trim())||
   new Set(linkIds).size!==linkIds.length){
toast("Link IDs must be non-empty and unique.");
return;
}
const endpointSet=new Set(endpointIds);
if(topology.links.some(l=>
   !l||!endpointSet.has(l.source)||!endpointSet.has(l.destination)||
   l.source===l.destination)){
toast("Every link must connect two different existing endpoints.");
return;
}
topology.source="backend";
const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),8000);
try{
const base=L.url.replace(/\/+$/,"");
const response=await fetch(base+"/topology",{
method:"PUT",
credentials:"omit",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(topology),
signal:controller.signal
});
const result=await response.json();
if(!response.ok){
throw new Error(result.detail||"HTTP "+response.status);
}
S.backendTopology=result;
L.last=new Date().toISOString();
L.msg="";
toast("Saved to backend: "+result.endpoints.length+" endpoints and "+result.links.length+" links.");
render();
}catch(x){
L.msg="Topology save failed: "+(x&&x.message||"unknown error");
toast(L.msg);
render();
}finally{
clearTimeout(timeout);
}
}

async function startFpga(){
if(S.live.state!=="connected"||S.live.target!=="fpga"){
toast("Connect to the PYNQ-Z2 target first.");
return;
}
if(S.hardwareBusy)return;
const number=id=>Number(document.getElementById(id).value);
const maskText=document.getElementById("hwFaultMask").value.trim();
const mask=Number.parseInt(maskText,0);
const payload={
workload:number("hwWorkload"),
target_link:number("hwTarget"),
fault_type:number("hwFaultType"),
fault_enable:document.getElementById("hwFaultEnable").checked,
fault_mask:mask,
delay_cycles:number("hwDelay"),
drop_interval:number("hwDrop")
};
if(!Number.isInteger(mask)||mask<0||mask>0xFFFFFFFF){
toast("Fault mask must be an integer from 0 to 0xFFFFFFFF.");
return;
}
if(!Number.isInteger(payload.workload)||payload.workload<1||payload.workload>65535||
!Number.isInteger(payload.target_link)||payload.target_link<0||payload.target_link>15||
!Number.isInteger(payload.fault_type)||payload.fault_type<0||payload.fault_type>3||
!Number.isInteger(payload.delay_cycles)||payload.delay_cycles<0||payload.delay_cycles>255||
!Number.isInteger(payload.drop_interval)||payload.drop_interval<0||payload.drop_interval>255){
toast("Check the workload and fault configuration limits.");
return;
}
S.hardwareBusy=true;
render();
try{
await backendApi("/hardware/start",{method:"POST",body:JSON.stringify(payload)});
toast("Workload start command sent to the FPGA.");
S.hardwareStatus=await backendApi("/hardware/status");
S.live.last=new Date().toISOString();
S.live.msg="";
}catch(x){
S.live.msg="FPGA start failed: "+x.message;
toast(S.live.msg);
}finally{
S.hardwareBusy=false;
render();
}
}

async function connect(){
const L=S.live;
L.url=$("#lu").value.trim();
let u;
try{u=new URL(L.url)}catch(_){
L.msg="Enter a full URL such as http://127.0.0.1:8000/api/v1.";
return render()
}
if(!/^https?:$/.test(u.protocol)||u.username||u.password){
L.msg="Use an http(s) URL without embedded credentials.";
return render()
}
L.state="connecting";
L.msg="";
S.backendTopology=null;
render();

const c=new AbortController();
const t=setTimeout(()=>c.abort(),6000);
try{
const base=L.url.replace(/\/+$/,"");
const options={signal:c.signal,credentials:"omit"};

const healthResponse=await fetch(base+"/health",options);
if(!healthResponse.ok)throw new Error("Health check HTTP "+healthResponse.status);
const health=await healthResponse.json();
if(health.status!=="ok")throw new Error("Unexpected health response");

const topologyResponse=await fetch(base+"/topology",options);
if(!topologyResponse.ok)throw new Error("Topology HTTP "+topologyResponse.status);
const topology=await topologyResponse.json();

if(topology.schemaVersion!==1||
   !Array.isArray(topology.endpoints)||
   !Array.isArray(topology.links)||
   topology.endpoints.length<2||
   topology.links.length<1){
throw new Error("Invalid backend topology response");
}

const endpointIds=new Set(topology.endpoints.map(p=>p.id));
if(topology.links.some(l=>
   !l.id||!endpointIds.has(l.source)||!endpointIds.has(l.destination)||
   l.source===l.destination)){
throw new Error("Backend topology contains invalid link references");
}

const hardwareStatus=L.target==="fpga"?await backendApi("/hardware/status"):null;
S.hardwareStatus=hardwareStatus;
S.backendTopology=topology;
L.state="connected";
L.last=new Date().toISOString();
L.msg="";
toast(L.target==="fpga"
?"Connected to FastAPI and PYNQ-Z2 hardware bridge."
:"Connected: "+topology.endpoints.length+" endpoints and "+topology.links.length+" links loaded.");
}
catch(x){
S.backendTopology=null;
S.hardwareStatus=null;
L.state="error";
L.msg="Connection failed: "+(x&&x.message||"unreachable")+". No backend topology loaded.";
}
finally{
clearTimeout(t);
render();
}
}
